<!DOCTYPE html>
<html lang="id" class="dark">
<head>

  <!-- Content Security Policy pelindung keamanan tambahan -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:;">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body class="antialiased selection:bg-blue-600 selection:text-white">

            RYZ

        </div>
        <div>
          <h1 class="text-sm font-extrabold tracking-wide text-white leading-tight">RYUZA OFFICIAL</h1>
          <p class="text-[11px] font-bold text-sky-400 tracking-wider">MLBB SCRIPT</p>

      <!-- Tombol Pencarian & Menu Admin -->

        </button>
        <button onclick="openAdminModal()" class="w-10 h-10 rounded-xl bg-[#161e2e] border border-slate-700/70 flex items-center justify-center text-slate-300 hover:text-white transition" title="Login Admin">

    </div>

    <!-- Kotak Pencarian Judul (Hidden by default) -->
    <div id="searchBarContainer" class="max-w-xl mx-auto px-4 pb-3 hidden">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="filterPosts()" placeholder="Cari judul script (contoh: Obsidia, Aspirant, Fanny)..."

  <!-- KONTEN UTAMA -->

    <!-- Tampilan Detail Postingan (Mirip Referensi Gambar) -->

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#0b0f17]/95 backdrop-blur-md border-t border-slate-800/80 z-40">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-around">
      <button onclick="resetView()" class="flex flex-col items-center gap-1 text-blue-500">

      <button onclick="resetView()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">

      <button onclick="showToast('Fitur Artikel segera hadir!')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">

      <button onclick="openAdminModal()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-right-to-bracket text-lg"></i>
        <span class="text-[10px] font-medium">Masuk</span>

  </nav>

  <!-- MODAL LOGIN ADMIN -->
  <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="card-dark w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-700">
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-blue-600/20 border border-blue-500/30 rounded-xl mx-auto flex items-center justify-center text-blue-400 mb-3">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <h2 class="text-lg font-bold text-white">Login Admin Ryuza</h2>
        <p class="text-xs text-slate-400">Masukkan kredensial khusus administrator</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
          <input type="text" id="adminUser" required placeholder="admin" class="w-full bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">

        <div>

  <!-- MODAL PANEL ADMIN (TAMBAH SCRIPT UNLIMITED) -->
  <div id="dashboardModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 overflow-y-auto p-4 hidden">
    <div class="max-w-xl mx-auto my-6 card-dark rounded-2xl p-6 shadow-2xl border border-slate-700 space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-green-600/20 text-green-400 flex items-center justify-center border border-green-500/30">
            <i class="fa-solid fa-circle-plus"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-white">Panel Admin Ryuza</h2>
            <p class="text-xs text-emerald-400 font-medium">Status: Aktif & Terautentikasi</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 rounded-xl text-xs font-bold transition">
            Logout
          </button>
          <button onclick="closeDashboardModal()" class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Form Tambah Postingan Baru -->
      <form onsubmit="submitNewPost(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Judul Script / Skin</label>
          <input type="text" id="postTitle" required placeholder="Contoh: New Update! Script Skin Obsidia Aspirant..." class="w-full bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Kategori</label>
            <input type="text" id="postCategory" value="Skin Custom" required class="w-full bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Upload Foto / Banner</label>
            <input type="file" id="postImageFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Deskripsi Lengkap</label>
          <textarea id="postDesc" rows="3" required placeholder="Tuliskan detail fitur script..." class="w-full bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <!-- Tombol Link Unlimited -->
        <div class="space-y-3 pt-2 border-t border-slate-800">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Tombol Link Download (Unlimited)</label>
            <button type="button" onclick="addLinkRow()" class="px-2.5 py-1 bg-blue-600/20 border border-blue-500/30 text-blue-400 hover:bg-blue-600/30 rounded-lg text-xs font-bold flex items-center gap-1.5">
              <i class="fa-solid fa-plus text-[10px]"></i> Tambah Link
            </button>
          </div>
          <div id="linksContainer" class="space-y-2.5 max-h-48 overflow-y-auto pr-1">
            <!-- Baris link default -->
            <div class="flex items-center gap-2 link-row">
              <input type="text" placeholder="Nama Tombol (Cth: Replace : Default)" class="link-label w-1/3 bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" value="Replace : Default" required>
              <input type="url" placeholder="URL Link (https://...)" class="link-url w-2/3 bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" value="https://mediafire.com" required>
              <button type="button" onclick="removeLinkRow(this)" class="p-2 text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl btn-download text-white font-bold text-sm shadow-lg shadow-blue-600/30 mt-4">
          Publikasikan Script Sekarang
        </button>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold z-50 transition-all duration-300 opacity-0 pointer-events-none">
    Notifikasi Pesan
  </div>

  <!-- JAVASCRIPT FRONTEND -->
  <script>
    // =========================================================================
    // DETEKSI LINGKUNGAN GOOGLE APPS SCRIPT VS PREVIEW LOKAL (FALLBACK ENGINE)
    // =========================================================================
    const isGAS = (typeof google !== 'undefined' && google.script && google.script.run);

    // Data awal contoh untuk mode Preview agar tampilan langsung terlihat
    const defaultMockPosts = [
      {
        id: "RYUZA-DEMO-1",
        title: "New Update! Script Skin Obsidia Aspirant Imperatrix Arashi No Password Terbaru Full Effect Voice",
        category: "Skin Custom",
        imageUrl: "https://placehold.co/800x450/1e293b/38bdf8?text=SCRIPT+OBSIDIA+ASPIRANT+RYUZA+OFFICIAL",
        description: "Full effect skin & voice, tanpa password, update terbaru, tampilkan Script Obsidia Aspirant Imperatrix Arashi dengan semua efek visual.\n\n✅ Full Background\n✅ Full Effect & Voice\n✅ Work Classic & Rank\n✅ 100% Aman Anti Banned",
        links: [
          { label: "Replace : Default", url: "https://mediafire.com" },
          { label: "Replace : Default + Logo", url: "https://mediafire.com" },
          { label: "Replace : Basic", url: "https://mediafire.com" },
          { label: "Replace : Starlight", url: "https://mediafire.com" },
          { label: "Backup File", url: "https://mediafire.com" }
        ],
        date: "04 Sep 2026"
      }
    ];

    // Wrapper universal untuk menjalankan fungsi backend baik di Google Apps Script maupun Preview Lokal
    function runBackend(funcName, args, onSuccess, onFailure) {
      if (isGAS) {
        let runner = google.script.run.withSuccessHandler(onSuccess);
        if (onFailure) runner = runner.withFailureHandler(onFailure);
        runner[funcName](...args);
      } else {
        // Simulasi Backend Lokal saat dijalankan di Preview / Browser biasa
        setTimeout(() => {
          try {
            if (funcName === "getPosts") {
              let saved = JSON.parse(localStorage.getItem("ryuza_mock_posts") || "null");
              if (!saved) {
                saved = defaultMockPosts;
                localStorage.setItem("ryuza_mock_posts", JSON.stringify(saved));
              }
              onSuccess(saved);
            } 
            else if (funcName === "loginAdmin") {
              const [u, p] = args;
              if (u === "admin" && p === "369258") {
                onSuccess({ success: true, token: "mock-token-" + Date.now() });
              } else {
                onSuccess({ success: false, message: "Username atau Password salah!" });
              }
            } 
            else if (funcName === "logoutAdmin") {
              onSuccess(true);
            } 
            else if (funcName === "addPost") {
              const [token, postData] = args;
              if (!token) throw new Error("Akses Ditolak: Silakan login admin.");
              
              let saved = JSON.parse(localStorage.getItem("ryuza_mock_posts") || "[]");
              const imgDataUrl = postData.imageBase64 
                ? `data:${postData.imageMime};base64,${postData.imageBase64}` 
                : "https://placehold.co/800x450/1e293b/38bdf8?text=RYUZA+SCRIPT";
              
              const newPost = {
                id: "RYUZA-" + Date.now(),
                title: postData.title,
                category: postData.category || "Skin Custom",
                imageUrl: imgDataUrl,
                description: postData.description,
                links: postData.links,
                date: new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" })
              };
              saved.unshift(newPost);
              localStorage.setItem("ryuza_mock_posts", JSON.stringify(saved));
              onSuccess({ success: true, message: "Script berhasil dipublikasikan! (Mode Preview)" });
            } 
            else if (funcName === "deletePost") {
              const [token, postId] = args;
              if (!token) throw new Error("Akses Ditolak.");
              let saved = JSON.parse(localStorage.getItem("ryuza_mock_posts") || "[]");
              saved = saved.filter(item => item.id !== postId);
              localStorage.setItem("ryuza_mock_posts", JSON.stringify(saved));
              onSuccess({ success: true, message: "Postingan berhasil dihapus." });
            }
          } catch (err) {
            if (onFailure) onFailure(err);
          }
        }, 300);
      }
    }

    let allPosts = [];
    let currentAdminToken = localStorage.getItem("ryuza_admin_token") || "";

    window.onload = function() {
      fetchPosts();
    };

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 3000);
    }

    function toggleSearch() {
      const bar = document.getElementById("searchBarContainer");
      bar.classList.toggle("hidden");
      if (!bar.classList.contains("hidden")) {
        document.getElementById("searchInput").focus();
      }
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      filterPosts();
    }

    function filterPosts() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
      renderPostsFeed(filtered);
    }

    function fetchPosts() {
      runBackend(
        "getPosts",
        [],
        posts => {
          allPosts = posts;
          document.getElementById("loadingIndicator").classList.add("hidden");
          document.getElementById("postsFeed").classList.remove("hidden");
          renderPostsFeed(allPosts);
        },
        err => {
          document.getElementById("loadingIndicator").innerHTML = `<p class="text-red-400 text-xs">Gagal memuat data: ${err.message}</p>`;
        }
      );
    }

    function renderPostsFeed(posts) {
      const feed = document.getElementById("postsFeed");
      if (posts.length === 0) {
        feed.innerHTML = `
          <div class="text-center py-16 card-dark rounded-2xl p-6">
            <i class="fa-solid fa-folder-open text-3xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 text-sm">Belum ada script atau postingan ditemukan.</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = posts.map(p => `
        <div class="card-dark rounded-2xl overflow-hidden shadow-lg border border-slate-800 transition hover:border-slate-700">
          <!-- Thumbnail Gambar -->
          <div class="relative aspect-video bg-slate-900 cursor-pointer overflow-hidden" onclick="viewDetail('${p.id}')">
            <img src="${p.imageUrl}" alt="${p.title}" class="w-full h-full object-cover hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/600x338/131a26/ffffff?text=Ryuza+Script'">
            <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg border border-white/10 text-[11px] font-bold text-amber-400 flex items-center gap-1.5">
              <i class="fa-solid fa-tag text-[9px]"></i> ${p.category}
            </div>
          </div>

          <!-- Info Post -->
          <div class="p-4 space-y-3">
            <h2 onclick="viewDetail('${p.id}')" class="text-sm md:text-base font-bold text-white hover:text-blue-400 cursor-pointer line-clamp-2 leading-snug">
              ${p.title}
            </h2>

            <div class="flex items-center gap-4 text-[11px] text-slate-400 font-medium">
              <span><i class="fa-regular fa-calendar mr-1"></i> ${p.date}</span>
              <span class="text-amber-400 font-bold"><i class="fa-solid fa-fire mr-1"></i> Terpopuler</span>
            </div>

            <p class="text-xs text-slate-300 line-clamp-2 leading-relaxed">${p.description}</p>

            <div class="pt-2 flex items-center justify-between border-t border-slate-800/80">
              <div class="flex items-center gap-2">
                <span class="text-[11px] text-slate-400 font-semibold">Bagikan:</span>
                <button onclick="shareToWhatsApp('${p.title}')" class="w-7 h-7 rounded-lg bg-emerald-600/20 text-emerald-400 flex items-center justify-center hover:bg-emerald-600/30 transition"><i class="fa-brands fa-whatsapp text-xs"></i></button>
                <button onclick="shareToTelegram('${p.title}')" class="w-7 h-7 rounded-lg bg-sky-600/20 text-sky-400 flex items-center justify-center hover:bg-sky-600/30 transition"><i class="fa-brands fa-telegram text-xs"></i></button>
                <button onclick="copyLink(window.location.href)" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center hover:bg-slate-700 transition"><i class="fa-solid fa-copy text-xs"></i></button>
              </div>

              <button onclick="viewDetail('${p.id}')" class="px-4 py-2 rounded-xl btn-download text-white font-bold text-xs shadow-md">
                Unduh Script
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function viewDetail(id) {
      const p = allPosts.find(item => item.id === id);
      if (!p) return;

      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.getElementById("postsFeed").classList.add("hidden");
      document.getElementById("postDetailView").classList.remove("hidden");

      const linksHtml = p.links.map(l => `
        <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-4 rounded-xl btn-download text-white font-bold text-xs md:text-sm flex items-center justify-center gap-2.5 shadow-lg shadow-blue-600/20">
          <i class="fa-solid fa-cloud-arrow-down text-base"></i> ${l.label}
        </a>
      `).join('');

      document.getElementById("detailContent").innerHTML = `
        <div class="relative aspect-video rounded-xl overflow-hidden bg-slate-900 border border-slate-800">
          <img src="${p.imageUrl}" alt="${p.title}" class="w-full h-full object-cover">
        </div>

        <div class="space-y-2">
          <span class="inline-block px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[11px] font-bold rounded-lg">
            ${p.category}
          </span>
          <h2 class="text-base md:text-lg font-extrabold text-white leading-snug">${p.title}</h2>
          <div class="flex items-center gap-4 text-xs text-slate-400 font-medium pb-2 border-b border-slate-800">
            <span><i class="fa-regular fa-calendar mr-1"></i> ${p.date}</span>
            <span class="text-emerald-400"><i class="fa-solid fa-shield-check mr-1"></i> 100% Aman & Clean</span>
          </div>
        </div>

        <div class="text-xs md:text-sm text-slate-300 leading-relaxed space-y-2 whitespace-pre-line bg-[#0b0f17] p-4 rounded-xl border border-slate-800">
          ${p.description}
        </div>

        <!-- Tombol Download Unlimited -->
        <div class="space-y-3 pt-3">
          <div class="bg-[#161e2e] p-3 rounded-xl border border-slate-700/60 mb-2">
            <h3 class="text-xs font-extrabold text-white flex items-center gap-2">
              <i class="fa-solid fa-download text-blue-400"></i> Download Script
            </h3>
            <p class="text-[11px] text-slate-400 mt-0.5">Pilih tombol server di bawah untuk mengunduh file script.</p>
          </div>
          ${linksHtml}
          
          <a href="https://whatsapp.com" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-4 rounded-xl btn-wa text-white font-bold text-xs md:text-sm flex items-center justify-center gap-2 shadow-lg">
            <i class="fa-brands fa-whatsapp text-lg"></i> Ikuti juga Channel WhatsApp kami
          </a>
        </div>

        <!-- Panduan Instalasi -->
        <div class="card-dark p-4 rounded-xl border border-slate-800 space-y-2 mt-4">
          <h3 class="text-xs font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-book-open text-amber-400"></i> Panduan Instalasi
          </h3>
          <p class="text-xs text-slate-400 leading-relaxed">
            1. Unduh file script melalui tombol di atas.<br>
            2. Ekstrak file ZIP menggunakan ZArchiver.<br>
            3. Salin folder <i>com.mobile.legends</i> ke direktori penyimpanan game Anda.<br>
            4. Buka Mobile Legends dan nikmati skin kustom baru!
          </p>
        </div>

        ${currentAdminToken ? `
          <div class="pt-4 border-t border-slate-800">
            <button onclick="deletePost('${p.id}')" class="w-full py-2.5 bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 rounded-xl text-xs font-bold transition">
              <i class="fa-solid fa-trash-can mr-1.5"></i> Hapus Postingan Ini (Admin)
            </button>
          </div>
        ` : ''}
      `;
    }

    function resetView() {
      document.getElementById("postDetailView").classList.add("hidden");
      document.getElementById("postsFeed").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Modal Admin Control
    function openAdminModal() {
      if (currentAdminToken) {
        document.getElementById("dashboardModal").classList.remove("hidden");
      } else {
        document.getElementById("adminModal").classList.remove("hidden");
      }
    }

    function closeAdminModal() {
      document.getElementById("adminModal").classList.add("hidden");
    }

    function closeDashboardModal() {
      document.getElementById("dashboardModal").classList.add("hidden");
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("adminUser").value;
      const p = document.getElementById("adminPass").value;

      runBackend(
        "loginAdmin",
        [u, p],
        res => {
          if (res.success) {
            currentAdminToken = res.token;
            localStorage.setItem("ryuza_admin_token", currentAdminToken);
            closeAdminModal();
            document.getElementById("adminPass").value = "";
            showToast("Login berhasil! Selamat datang Admin.");
            openAdminModal();
          } else {
            showToast(res.message);
          }
        },
        err => {
          showToast("Error: " + err.message);
        }
      );
    }

    function handleLogout() {
      runBackend(
        "logoutAdmin",
        [currentAdminToken],
        () => {
          currentAdminToken = "";
          localStorage.removeItem("ryuza_admin_token");
          closeDashboardModal();
          showToast("Berhasil logout.");
          resetView();
          fetchPosts();
        }
      );
    }

    function deletePost(postId) {
      runBackend(
        "deletePost",
        [currentAdminToken, postId],
        res => {
          showToast(res.message);
          resetView();
          fetchPosts();
        },
        err => {
          showToast("Gagal menghapus: " + err.message);
        }
      );
    }

    // Tambah & Hapus Baris Link Download Dinamis
    function addLinkRow() {
      const container = document.getElementById("linksContainer");
      const div = document.createElement("div");
      div.className = "flex items-center gap-2 link-row";
      div.innerHTML = `
        <input type="text" placeholder="Nama Tombol (Cth: Replace : Basic)" class="link-label w-1/3 bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required>
        <input type="url" placeholder="URL Link (https://...)" class="link-url w-2/3 bg-[#0b0f17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required>
        <button type="button" onclick="removeLinkRow(this)" class="p-2 text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can text-xs"></i></button>
      `;
      container.appendChild(div);
    }

    function removeLinkRow(btn) {
      const rows = document.querySelectorAll(".link-row");
      if (rows.length > 1) {
        btn.parentElement.remove();
      } else {
        showToast("Minimal harus ada 1 tombol link download!");
      }
    }

    // Submit Postingan Baru
    function submitNewPost(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "Mengunggah & Menyimpan...";
      submitBtn.disabled = true;

      const title = document.getElementById("postTitle").value;
      const category = document.getElementById("postCategory").value;
      const description = document.getElementById("postDesc").value;
      const fileInput = document.getElementById("postImageFile");

      // Kumpulkan semua link dari form
      const links = [];
      document.querySelectorAll(".link-row").forEach(row => {
        const label = row.querySelector(".link-label").value;
        const url = row.querySelector(".link-url").value;
        if (label && url) {
          links.push({ label, url });
        }
      });

      const finishSubmission = (imageBase64 = "", imageName = "", imageMime = "") => {
        const postData = { title, category, description, links, imageBase64, imageName, imageMime };
        
        runBackend(
          "addPost",
          [currentAdminToken, postData],
          res => {
            submitBtn.innerText = "Publikasikan Script Sekarang";
            submitBtn.disabled = false;
            closeDashboardModal();
            showToast(res.message);
            // Reset Form
            document.getElementById("postTitle").value = "";
            document.getElementById("postDesc").value = "";
            document.getElementById("postImageFile").value = "";
            fetchPosts();
          },
          err => {
            submitBtn.innerText = "Publikasikan Script Sekarang";
            submitBtn.disabled = false;
            showToast("Gagal: " + err.message);
          }
        );
      };

      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          const base64String = evt.target.result.split(",")[1];
          finishSubmission(base64String, file.name, file.type);
        };
        reader.readAsDataURL(file);
      } else {
        showToast("Pilih file gambar banner terlebih dahulu!");
        submitBtn.innerText = "Publikasikan Script Sekarang";
        submitBtn.disabled = false;
      }
    }

    function shareToWhatsApp(title) {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent("Yuk download script MLBB terbaru: " + title + " di Ryuza Official!")}`, "_blank");
    }

    function shareToTelegram(title) {
      window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(title)}`, "_blank");
    }

    function copyLink(text) {
      if (document.execCommand) {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        showToast("Link berhasil disalin ke clipboard!");
      } else {
        navigator.clipboard.writeText(text).then(() => {
          showToast("Link berhasil disalin ke clipboard!");
        });
      }
    }
  </script>
</body>
</html>
